name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and validate publishable surface
        run: npm run check

      - name: Dependency audit (production and development)
        run: npm audit

      - name: Package dry-run
        run: npm run pack:dry-run

      - name: Python runner syntax
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/code-review-runner.py').read_text())"

  semgrep:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python -m pip install semgrep

      - name: Run semgrep
        run: semgrep --config auto --no-git-ignore --error --exclude node_modules --exclude .git --exclude '*.tgz' scripts extensions mcp

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
